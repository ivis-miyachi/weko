version: "3.2"

services:

  elasticsearch:
    restart: "always"
    build:
      context: .
      dockerfile: ./update/v2.2.0/W2026-31/elasticsearch/docker/elasticsearch/Dockerfile
      args:
        - ELASTICSEARCH_S3_ACCESS_KEY=${ELASTICSEARCH_S3_ACCESS_KEY}
        - ELASTICSEARCH_S3_SECRET_KEY=${ELASTICSEARCH_S3_SECRET_KEY}
        - ELASTICSEARCH_S3_ENDPOINT=${ELASTICSEARCH_S3_ENDPOINT}
        - ELASTICSEARCH_S3_BUCKET=${ELASTICSEARCH_S3_BUCKET}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    environment:
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms2048m -Xmx2048m"
    ports:
      - "29204:9200"
      - "29304:9300"

  elasticsearch7:
    restart: "always"
    build:
      context: .
      dockerfile: ./update/v2.2.0/W2026-31/elasticsearch/docker/elasticsearch/Dockerfile.es-v7
      args:
        - ELASTICSEARCH_S3_ACCESS_KEY=${ELASTICSEARCH_S3_ACCESS_KEY}
        - ELASTICSEARCH_S3_SECRET_KEY=${ELASTICSEARCH_S3_SECRET_KEY}
        - ELASTICSEARCH_S3_ENDPOINT=${ELASTICSEARCH_S3_ENDPOINT}
        - ELASTICSEARCH_S3_BUCKET=${ELASTICSEARCH_S3_BUCKET}
    volumes:
      - es-data7:/usr/share/elasticsearch/data
    environment:
      - "discovery.type=single-node"
      - "ES_JAVA_OPTS=-Xms2048m -Xmx2048m"
      - reindex.remote.whitelist=elasticsearch:9200
    ports:
      - "29202:9200"
      - "29302:9300"
  opensearch:
    environment:
      - reindex.remote.allowlist=elasticsearch7:9200


volumes:
  es-data:
  es-data7:
  os-data:
#  letsencrypt_etc:
#  letsencrypt_html:

